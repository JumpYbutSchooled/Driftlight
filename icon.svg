<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.7" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#05070e"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff0ff" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#7ff0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#8fa2bd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <circle cx="200" cy="58" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="58" cy="76" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="214" cy="170" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="40" cy="196" r="2.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="122" cy="30" r="1.8" fill="#ffffff" opacity="0.5"/>
  <!-- the drift: a long light trail sweeping in from the lower left -->
  <path d="M18 238 C 70 200, 110 168, 150 118" stroke="url(#trail)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M36 246 C 86 210, 122 176, 158 128" stroke="url(#trail)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- the ship: a swept dart heading up and right -->
  <g transform="translate(160 104) rotate(45)">
    <path d="M0 -52 L16 18 L6 12 L0 24 L-6 12 L-16 18 Z" fill="url(#hull)"/>
    <path d="M0 -52 L5 -10 L0 -4 L-5 -10 Z" fill="#4a7fd0"/>
    <path d="M-16 18 L-34 34 L-30 40 L-8 26 Z" fill="#c7d3e3"/>
    <path d="M16 18 L34 34 L30 40 L8 26 Z" fill="#c7d3e3"/>
    <circle cx="0" cy="30" r="9" fill="url(#glow)"/>
  </g>
  <!-- a light at the far end, where it's going -->
  <circle cx="206" cy="58" r="22" fill="url(#glow)" opacity="0.55"/>
</svg>
